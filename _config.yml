# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: AaronDump
subtitle: ""
description: ""
keywords:
author: Aaron
language: en
timezone: "Europe/London"
email: youareaaron0@gmail.com

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://ceobe33.github.io
root: /
# 如果末尾没有 ‘/’ 就会有点击博客文章变成下载的bug
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

algolia:
  applicationID: "U6QCVP4ZGT"
  apiKey: "16ae350b285ac2c45e4104dcb4551b81"
  indexName: "aaroncode"

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  # 原样复制，不经过渲染管线：否则插件会把 APlayer 的 <link>/<script> 注入到
  # 文件开头 —— 整页会在 <!DOCTYPE html> 之前（浏览器退化为怪异模式），
  # .js 则直接变成非法语法，模块导不出启动函数。
  - spine-studio/*
  # 同理：vendored 的第三方库必须原样落盘。渲染管线（nunjucks）会把
  # instantsearch 之类压缩过的 .js 当成模板，遇到 "#" 直接报错构建失败。
  - pluginsSrc/**

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false

post_asset_folder: true
marked:
  prependRoot: true
  postAsset: true

relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ""

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Home:  /  ||  fas  fa-home
# Archives:  /archives/  ||  fas  fa-archive
# Tags:  /tags/  ||  fas  fa-tags
# Categories:  /categories/  ||  fas  fa-folder-open
# List||fas  fa-list: Music: /music/ || fas fa-music Movie: /movies/ || fas fa-video Link: /link/ || fas fa-link About: /about/ || fas fa-heart

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: "mtime"

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include: []
exclude: []
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# hexo-math 默认从 cdn.jsdelivr.net 注入 KaTeX 样式，这里改成本地副本
# （文件由 tools/vendor-plugins.py 落到 source/pluginsSrc/）
math:
  katex:
    css: /pluginsSrc/katex/dist/katex.min.css
  mathjax:
    css: /pluginsSrc/hexo-math/dist/style.css

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: "git"
  repo: "https://github.com/Ceobe33/Ceobe33.github.io"
  branch: master
  token: $GITHUB_TOKEN
